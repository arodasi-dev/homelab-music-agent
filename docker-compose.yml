services:
  yt-music-agent:
    build: .
    container_name: yt-music-agent
    restart: unless-stopped
    env_file: .env
    # Só o próprio notebook alcança a porta (quem publica na tailnet é o `tailscale serve`).
    # Não troque por "8091:8091": o Docker abriria a porta pra rede toda, ignorando o ufw.
    ports:
      - "127.0.0.1:8091:8091"
    # O gunicorn tenta criar um socket de controle no HOME; o do usuário `music` não existe e o disco é só leitura.
    environment:
      HOME: /tmp
    # Volume do Docker (e não pasta do host): ele herda o dono `music` da imagem, então dá pra gravar.
    # Uma pasta ./data seria criada pelo Docker como root e o container não conseguiria escrever nela.
    volumes:
      - music-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  music-data:
